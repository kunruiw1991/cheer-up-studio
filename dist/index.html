.panel-title {

  font-size: 1.15rem;

}

.btn-secondary:hover {

    // Recovery escape hatch: open .../?reset=1 to wipe saved studio data, caches and
    // the service worker, then reload clean. Useful if the iPad ever shows a blank page.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        if (params.get('reset') === '1') {
          try { localStorage.clear(); } catch (e) {}
          var tasks = [];
          if (window.caches && caches.keys) {
            tasks.push(caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); }));
          }
          Promise.all(tasks).catch(function () {}).then(function () {
            location.replace(location.pathname);
          });
        }
      } catch (e) {}
    })();

    // Boot watchdog: if the studio modules have not mounted within 8 s (JS crash,
    // corrupted saved data, ...), show a visible recovery banner instead of a blank page.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var mounted = document.querySelector('[data-testid="tattoo-canvas"]');
        if (mounted) return;
        var bar = document.createElement('div');
        bar.setAttribute('data-testid', 'boot-recovery-banner');
        bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:14px 16px;border-radius:14px;background:#fff7ed;color:#7c2d12;font:600 15px/1.4 -apple-system,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;flex-wrap:wrap;';
        bar.innerHTML = '<span>😿 The studio did not finish loading.</span>' +
          '<button type="button" style="padding:10px 16px;border:0;border-radius:10px;background:#7c3aed;color:#fff;font:inherit;font-weight:700;">🔄 Reload</button>' +
          '<button type="button" style="padding:10px 16px;border:0;border-radius:10px;background:#dc2626;color:#fff;font:inherit;font-weight:700;">🧹 Reset studio data</button>';
        var btns = bar.querySelectorAll('button');
        btns[0].onclick = function () { location.reload(); };
        btns[1].onclick = function () { location.href = location.pathname + '?reset=1'; };
        document.body.appendChild(bar);
      }, 8000);
    });

function pushHistory() {
const trimmed = state.history.slice(0, state.historyIndex + 1);

function renderAll() {

const H = sourceCanvas.height;

ctx.save();
ctx.clearRect(0, 0, W, H);
const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, W * 0.72);
bgGrad.addColorStop(0, '#1e1b4b');
bgGrad.addColorStop(1, '#0f172a');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);
ctx.strokeStyle = 'rgba(196, 181, 253, 0.25)';
ctx.lineWidth = 2;
ctx.strokeRect(18, 18, W - 36, H - 36);
for (const layer of state.layers) {
renderTattooLayer(ctx, layer);
}
if (state.isDrawing && state.currentStrokePoints.length > 0) {
renderTattooLayer(ctx, {
id: 'live-stroke',
type: 'stroke',
x: 0,
y: 0,
scale: 1,
rotation: 0,
opacity: 1,
data: {
points: state.currentStrokePoints,
brushMode: state.brushMode,
color: state.color,
width: state.brushSize,
seed: 7777
}
});
}
ctx.restore();
renderVirtualTryOnCanvas(tryonCanvas, sourceCanvas, {
bodyPart: state.bodyPart,
skinTone: state.skinTone,
lighting: state.lighting
});
if (tryonAliasCanvas) {
renderVirtualTryOnCanvas(tryonAliasCanvas, sourceCanvas, {
bodyPart: state.bodyPart,
skinTone: state.skinTone,
lighting: state.lighting
});

return state.lastExportResult;
}

} catch (err) {
console.warn('[TattooStudio] sheet sync skipped:', err);
}
}, 180);
}

? points
: [
{ x: 140, y: 220 },
{ x: 260, y: 180 },
{ x: 380, y: 240 },
{ x: 460, y: 190 }
];
const newLayer = {
id: `layer-stroke-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
type: 'stroke',
x: 0,
y: 0,
scale: 1,
rotation: 0,
opacity: 1,
data: {
points: validPoints,
brushMode: brushMode || state.brushMode,
color: color || state.color,
width: Number(width) || state.brushSize,
seed: (state.layers.length + 1) * 98765

};
state.layers.push(newLayer);
state.selectedLayerId = newLayer.id;
pushHistory();
renderAll();

const target =
state.layers.find((l) => l.id === state.selectedLayerId) || state.layers[state.layers.length - 1];

const copy = JSON.parse(JSON.stringify(target));
copy.id = `layer-dup-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
copy.x = (copy.x || 300) + 24;
copy.y = (copy.y || 300) + 24;

function transformSelected({ scaleDelta = 0, rotationDelta = 0 } = {}) {
const target =
state.layers.find((l) => l.id === state.selectedLayerId) || state.layers[state.layers.length - 1];
if (!target) return null;
if (scaleDelta) {
target.scale = Math.max(0.25, Math.min(3.5, (target.scale || 1) + scaleDelta));
}
if (rotationDelta) {
target.rotation = (target.rotation || 0) + rotationDelta;
